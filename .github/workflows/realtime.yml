name: Realtime worker

# Runs one bounded market tick for market snapshots, scores, and signals.
# Anomaly analysis runs separately in anomalies.yml.
#
# Run manually from Actions tab: "Run workflow" → "workflow_dispatch"
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: realtime
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run job:realtime
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
          REALTIME_TICK_SECONDS: ${{ vars.REALTIME_TICK_SECONDS || '60' }}
          REALTIME_AUTH_SECRET: ${{ secrets.REALTIME_AUTH_SECRET }}
          REALTIME_ONCE: 'true'
